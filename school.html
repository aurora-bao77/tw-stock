:root{
  --bg:#eef6ff;--paper:#ffffff;--ink:#1f2a44;--mut:#5f6f8c;--line:#d7e3f5;--soft:#f3f8ff;
  --sun:#ffc93c;--coral:#ff6b6b;--mint:#22c3a6;--sky:#3d8bfd;--grape:#9b5de5;--peach:#ffe3c2;
  --accent:#3d8bfd;--accent2:#e3efff;--up:#e8364f;--down:#13a35b;--warnbg:#fff5d6;--okbg:#e2f8ee;--badbg:#ffe6e9;
  --grid:#e6eef9;--ma5:#f59e0b;--ma20:#3d8bfd;--ma60:#9b5de5;--onacc:#ffffff;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-fun:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a2b;--paper:#1b2438;--ink:#e8eefb;--mut:#a3b1cc;--line:#2c3a55;--soft:#202b42;--peach:#3a2d22;
  --accent:#6ea8ff;--accent2:#1f2f4f;--up:#ff5c70;--down:#33d17a;--warnbg:#332b14;--okbg:#14301f;--badbg:#3a1a20;
  --grid:#25324b;--onacc:#0f1626;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a2b;--paper:#1b2438;--ink:#e8eefb;--mut:#a3b1cc;--line:#2c3a55;--soft:#202b42;--peach:#3a2d22;
  --accent:#6ea8ff;--accent2:#1f2f4f;--up:#ff5c70;--down:#33d17a;--warnbg:#332b14;--okbg:#14301f;--badbg:#3a1a20;
  --grid:#25324b;--onacc:#0f1626;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);border-bottom:3px solid var(--sun);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-fun);font-size:22px;font-weight:800;color:var(--sky)}
.logo svg,.logo img{width:40px;height:40px}#logoNiu{display:inline-block;width:40px;height:40px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{font:inherit;font-family:var(--font-fun);border:2px solid var(--line);background:var(--paper);color:var(--ink);padding:5px 14px;border-radius:999px;cursor:pointer;font-weight:600}
nav button[aria-current="page"]{background:var(--sun);border-color:var(--sun);color:#3a2a00}
main{max-width:1120px;margin:0 auto;padding-block:20px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-fun);text-wrap:balance;line-height:1.35}
h1{font-size:27px;margin:0 0 6px}h2{font-size:21px;margin:26px 0 8px}h3{font-size:18px;margin:18px 0 6px}
p{margin:6px 0 10px;max-width:68ch}
.mut{color:var(--mut)}.up{color:var(--up)}.down{color:var(--down)}
.btn{font:inherit;font-family:var(--font-fun);border:0;background:var(--sky);color:var(--onacc);padding:9px 18px;border-radius:14px;cursor:pointer;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:none;font-weight:600}
.btn.buy{background:var(--up)}.btn.sell{background:var(--down)}.btn.sun{background:var(--sun);color:#3a2a00}.btn.grape{background:var(--grape)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:linear-gradient(120deg,var(--accent2),var(--peach));border-radius:22px;padding:16px 18px;margin-bottom:14px}
.hero svg,.hero img{width:140px!important;height:140px!important}
@media (max-width:520px){.hero{grid-template-columns:1fr;text-align:center}.hero svg,.hero img{margin:auto}}
.lessons{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:14px}
.lcard{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px 16px;cursor:pointer;display:grid;gap:4px;text-align:left;font:inherit;color:inherit;position:relative;overflow:hidden}
.lcard::before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:var(--c,var(--sky))}
.lcard:hover{transform:translateY(-2px);border-color:var(--c,var(--sky))}
.lnum{font-family:var(--font-fun);font-weight:800;color:var(--c,var(--sky))}
.lcard{padding-right:92px}.lcard .thumb{position:absolute;right:12px;top:12px;width:68px;height:68px;border-radius:18px;object-fit:cover;border:3px solid var(--c,var(--sky))}
.lcard b{font-size:17px;font-family:var(--font-fun)}.done{color:var(--down);font-size:13px;font-weight:700}
.progress{height:12px;background:var(--paper);border-radius:9px;overflow:hidden;max-width:420px;border:2px solid var(--line)}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--coral))}
.lesson{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px 20px}
.kid{background:var(--warnbg);border:2px dashed var(--sun);border-radius:16px;padding:12px 14px;margin:12px 0}
.kid b.t{font-family:var(--font-fun);color:#b7791f}
.teacher{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;background:var(--accent2);border-radius:18px;padding:10px 14px;margin:12px 0}
.teacher svg,.teacher img{width:64px!important;height:64px!important}
.teacher .say{font-family:var(--font-fun);font-size:16.5px;line-height:1.8}
.chartbox{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:6px;margin:10px 0;min-width:0}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;top:8px;left:10px;font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:3px 8px;pointer-events:none;font-variant-numeric:tabular-nums;max-width:calc(100% - 20px)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);padding:2px 6px}.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px;border-radius:2px}
.quiz{border:2px dashed var(--line);border-radius:16px;padding:12px 14px;margin:14px 0;background:var(--soft)}
.quiz .opts{display:grid;gap:8px;margin-top:8px}
.quiz button{font:inherit;text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 12px;border-radius:12px;cursor:pointer}
.quiz button.right{background:var(--okbg);border-color:var(--down)}.quiz button.wrong{background:var(--badbg);border-color:var(--up)}
.slider{display:grid;grid-template-columns:62px 1fr 52px;gap:8px;align-items:center;font-size:14px}.slider input{width:100%}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;font-variant-numeric:tabular-nums}
.stats div{background:var(--soft);border-radius:12px;padding:6px 10px;font-size:12.5px;color:var(--mut)}
.stats b{display:block;font-size:16px;color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.qty{display:flex;align-items:center;gap:6px}
input[type=number],input[type=text]{font:inherit;padding:7px 8px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);width:84px}
select{font:inherit;padding:7px 10px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);max-width:100%}
.fb{border-radius:14px;padding:10px 12px;margin-top:10px;font-size:14px}
.fb.good{background:var(--okbg)}.fb.bad{background:var(--badbg)}.fb.mid{background:var(--warnbg)}
.fb ul{margin:4px 0 0;padding-left:2px;list-style:none}
.fb .head{font-family:var(--font-fun);font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.fb .head svg,.fb .head img{width:34px!important;height:34px!important;flex:none}
.log{display:grid;gap:8px}
.log .t{border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-size:13.5px;background:var(--paper)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:0 8px;border-radius:6px;margin-right:6px;color:#fff}
.tag.b{background:var(--up)}.tag.s{background:var(--down)}
.score{font-family:var(--font-fun);font-size:52px;font-weight:800;color:var(--coral);line-height:1}
.setup{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:end}
.setup label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.checkrow{display:flex;flex-wrap:wrap;gap:12px;font-size:14px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500}
tr.sel{background:var(--accent2)}tr.click{cursor:pointer}tr.click:hover{background:var(--soft)}
.empty{padding:24px;text-align:center;color:var(--mut);background:var(--paper);border:2px dashed var(--line);border-radius:16px}
.modes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.mode{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:6px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.mode:hover{border-color:var(--grape)}.mode b{font-family:var(--font-fun);font-size:19px}
.vid{position:fixed;inset:0;background:rgba(10,16,30,.72);display:grid;place-items:center;z-index:30;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.vbox{background:var(--paper);border-radius:22px;width:min(760px,100%);max-height:100%;overflow:auto;padding:14px}
.screen{background:var(--soft);border-radius:16px;min-height:200px;position:relative;overflow:hidden}
.cap{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;margin-top:10px}
.cap svg,.cap img{width:72px!important;height:72px!important}
.cap .say{font-family:var(--font-fun);font-size:18px;line-height:1.7;min-height:3.4em}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--coral)}
.bounce{animation:bounce 1.6s ease-in-out infinite}@keyframes bounce{50%{transform:translateY(-5px)}}
.talk{animation:talk .35s ease-in-out infinite alternate}@keyframes talk{to{transform:scale(1.03) rotate(-1deg)}}
.ticker{display:flex;gap:16px;overflow-x:auto;padding:6px 2px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--soft);font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============================================================ 股價產生與指標 */
function genSeries(segs, seed = 7, start = 50) {
  const r = rng(seed), o = [], h = [], l = [], c = [], v = [];
  let p = start;
  for (const [days, drift, vol, vm] of segs) for (let i = 0; i < days; i++) {
    const op = rp(p * (1 + (r() - 0.5) * vol * 0.6));
    let ch = Math.max(-0.1, Math.min(0.1, drift + (r() - 0.5) * 2 * vol));
    const cl = rp(Math.max(1, p * (1 + ch)));
    o.push(op); c.push(cl); h.push(rp(Math.max(op, cl) * (1 + r() * vol * 0.8))); l.push(rp(Math.min(op, cl) * (1 - r() * vol * 0.8)));
    v.push(Math.round(1000 * vm * (0.6 + r() * 0.8) * (1 + Math.abs(ch) * 25))); p = cl;
  }
  return {o, h, l, c, v};
}
function sma(a, n) { const out = []; let s = 0; for (let i = 0; i < a.length; i++) { s += a[i]; if (i >= n) s -= a[i - n]; out.push(i >= n - 1 ? s / n : null) } return out }
function rsi(c, n = 14) { const out = Array(c.length).fill(null); let ag = 0, al = 0; for (let i = 1; i < c.length; i++) { const g = Math.max(c[i] - c[i - 1], 0), lo = Math.max(c[i - 1] - c[i], 0); if (i <= n) { ag += g / n; al += lo / n; if (i === n) out[i] = al ? 100 - 100 / (1 + ag / al) : 100 } else { ag = (ag * (n - 1) + g) / n; al = (al * (n - 1) + lo) / n; out[i] = al ? 100 - 100 / (1 + ag / al) : 100 } } return out }
function kd(s, n = 9) { const K = [], D = []; let k = 50, d = 50; for (let i = 0; i < s.c.length; i++) { const lo = Math.min(...s.l.slice(Math.max(0, i - n + 1), i + 1)), hi = Math.max(...s.h.slice(Math.max(0, i - n + 1), i + 1)); const rsv = hi === lo ? 50 : (s.c[i] - lo) / (hi - lo) * 100; k = k * 2 / 3 + rsv / 3; d = d * 2 / 3 + k / 3; K.push(k); D.push(d) } return {K, D} }
function indicators(s) { return {ma5: sma(s.c, 5), ma20: sma(s.c, 20), ma60: sma(s.c, 60), vma: sma(s.v, 20), rsi: rsi(s.c), kd: kd(s)} }

/* ============================================================ K 線圖 */
function drawChart(box, s, o = {}) {
  const from = o.from ?? 0, to = o.to ?? s.c.length - 1, n = to - from + 1;
  const W = Math.max(300, Math.round(box.clientWidth || 600)), sub = o.sub ? 70 : 0, VH = o.vol === false ? 0 : 56, PH = o.height || (W < 500 ? 220 : 270);
  const H = PH + VH + sub + (o.labels ? 22 : 6), L = 6, R = 50, cw = (W - L - R) / Math.max(n, o.slots || 0);
  const ind = o.ind || indicators(s);
  let hi = -1e9, lo = 1e9;
  for (let i = from; i <= to; i++) { hi = Math.max(hi, s.h[i]); lo = Math.min(lo, s.l[i]) }
  (o.hlines || []).forEach(x => { hi = Math.max(hi, x.v); lo = Math.min(lo, x.v) });
  if (o.range) { hi = o.range[1]; lo = o.range[0] }
  const pad = (hi - lo) * 0.07 || 1; hi += pad; lo -= pad;
  const X = i => L + (i - from) * cw + cw / 2, Y = v => 6 + (hi - v) / (hi - lo) * (PH - 12);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${W - R + 4}" y="${Y(v) + 4}" font-size="11" fill="var(--mut)">${fmt(v, v >= 100 ? 0 : 1)}</text>` }
  (o.bands || []).forEach(b => g += `<rect x="${L}" width="${W - L - R}" y="${Y(b.hi)}" height="${Math.max(2, Y(b.lo) - Y(b.hi))}" fill="${b.color}" opacity=".13"/>`);
  (o.hlines || []).forEach(h => g += `<line x1="${L}" x2="${W - R}" y1="${Y(h.v)}" y2="${Y(h.v)}" stroke="${h.color}" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${L + 4}" y="${Y(h.v) - 4}" font-size="12" font-weight="700" fill="${h.color}">${h.label}</text>`);
  let vmax = 1; for (let i = from; i <= to; i++) vmax = Math.max(vmax, s.v[i]);
  const bw = Math.max(1.2, cw * 0.66);
  for (let i = from; i <= to; i++) {
    const up = s.c[i] >= s.o[i], col = up ? 'var(--up)' : 'var(--down)', x = X(i), hl = o.highlight === i;
    if (hl) g += `<rect x="${x - cw}" y="0" width="${cw * 2}" height="${PH + VH}" fill="var(--sun)" opacity=".25"/>`;
    g += `<line x1="${x}" x2="${x}" y1="${Y(s.h[i])}" y2="${Y(s.l[i])}" stroke="${col}" stroke-width="${o.big ? 3 : 1}"/>`;
    g += `<rect x="${x - bw / 2}" y="${Y(Math.max(s.o[i], s.c[i]))}" width="${bw}" height="${Math.max(1, Math.abs(Y(s.o[i]) - Y(s.c[i])))}" fill="${col}" rx="${o.big ? 4 : 0}"/>`;
    if (VH) { const vh = s.v[i] / vmax * (VH - 8); g += `<rect x="${x - bw / 2}" y="${PH + VH - vh}" width="${bw}" height="${vh}" fill="${col}" opacity=".5"/>` }
  }
  const mas = o.ma || [5, 20, 60], mc = {5: 'var(--ma5)', 20: 'var(--ma20)', 60: 'var(--ma60)'};
  mas.forEach(k => { const m = ind['ma' + k]; const pts = []; for (let i = from; i <= to; i++) if (m[i] != null) pts.push(X(i).toFixed(1) + ',' + Y(m[i]).toFixed(1)); if (pts.length > 1) g += `<polyline fill="none" stroke="${mc[k]}" stroke-width="2" points="${pts.join(' ')}"/>` });
  if (o.sub) {
    const top = PH + VH + 4, y2 = v => top + (100 - v) / 100 * (sub - 8);
    g += `<rect x="${L}" y="${top}" width="${W - L - R}" height="${sub - 8}" fill="var(--soft)"/>`;
    [20, 80].forEach(v => g += `<line x1="${L}" x2="${W - R}" y1="${y2(v)}" y2="${y2(v)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${W - R + 4}" y="${y2(v) + 4}" font-size="10" fill="var(--mut)">${v}</text>`);
    [[ind.kd.K, 'var(--ma5)'], [ind.kd.D, 'var(--ma20)']].forEach(([arr, col]) => { const pts = []; for (let i = from; i <= to; i++) if (arr[i] != null) pts.push(X(i).toFixed(1) + ',' + y2(arr[i]).toFixed(1)); g += `<polyline fill="none" stroke="${col}" stroke-width="1.5" points="${pts.join(' ')}"/>` });
    g += `<text x="${L + 4}" y="${top + 12}" font-size="11" fill="var(--mut)">KD（黃 K／藍 D）</text>`;
  }
  (o.marks || []).forEach(m => { if (m.i < from || m.i > to) return; const x = X(m.i), buy = m.type === 'buy';
    g += `<text x="${x}" y="${buy ? Y(s.l[m.i]) + 16 : Y(s.h[m.i]) - 8}" font-size="13" font-weight="800" text-anchor="middle" fill="${buy ? 'var(--up)' : 'var(--down)'}">${buy ? '▲買' : '▼賣'}</text>` });
  (o.notes || []).forEach(m => { if (m.i < from || m.i > to) return;
    const x = X(m.i), low = m.at === 'low', y = low ? Y(s.l[m.i]) + 22 : Y(s.h[m.i]) - 14, anchor = x > W * 0.7 ? 'end' : x < W * 0.25 ? 'start' : 'middle';
    g += `<line x1="${x}" x2="${x}" y1="${low ? Y(s.l[m.i]) + 2 : Y(s.h[m.i]) - 2}" y2="${low ? y - 13 : y + 4}" stroke="var(--grape)" stroke-width="1.5"/>`;
    g += `<text x="${x}" y="${y}" font-size="13" font-weight="800" text-anchor="${anchor}" fill="var(--grape)" paint-order="stroke" stroke="var(--paper)" stroke-width="4">${m.text}</text>` });
  if (o.labels) [from, Math.round((from + to) / 2), to].forEach(i => g += `<text x="${X(i)}" y="${H - 4}" font-size="11" text-anchor="middle" fill="var(--mut)">${o.labels(i)}</text>`);
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="K線圖">${g}</svg><div class="tip" hidden></div>` +
    (o.legend === false ? '' : `<div class="legend">${mas.map(k => `<span><i style="background:${mc[k]}"></i>${k === 5 ? '5日線' : k === 20 ? '月線' : '季線'}</span>`).join('')}<span>紅K＝漲・綠K＝跌・下方柱子＝成交量</span></div>`);
  if (o.tip === false) return;
  const svg = box.querySelector('svg'), tip = box.querySelector('.tip');
  const show = e => { const rect = svg.getBoundingClientRect(), x = (e.clientX - rect.left) / rect.width * W;
    const i = Math.min(to, Math.max(from, from + Math.floor((x - L) / cw))), chg = i > 0 ? (s.c[i] / s.c[i - 1] - 1) * 100 : 0;
    tip.hidden = false; tip.innerHTML = `${o.labels ? o.labels(i) + '　' : ''}開 ${fmt(s.o[i])} 高 ${fmt(s.h[i])} 低 ${fmt(s.l[i])} 收 <b class="${cls(chg)}">${fmt(s.c[i])}（${pct(chg)}）</b>` };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show); svg.addEventListener('pointerleave', () => tip.hidden = true);
}

/* 課程用的示範股價 */
function shadowSeries() { const s = genSeries([[20, -0.012, 0.02, 1], [1, 0, 0.03, 2.5], [14, 0.012, 0.018, 1.3], [1, 0, 0.03, 3], [10, -0.01, 0.02, 1.2]], 12, 60);
  s.l[20] = rp(s.o[20] * 0.9); s.c[20] = rp(s.o[20] * 1.01); s.h[20] = rp(s.c[20] * 1.01); s.h[35] = rp(s.o[35] * 1.09); s.c[35] = rp(s.o[35]); s.l[35] = rp(s.o[35] * 0.99); return s }
const volSeries = () => genSeries([[25, 0, 0.012, 0.8], [12, 0.014, 0.018, 2.2], [10, 0.006, 0.012, 0.7], [10, -0.012, 0.02, 1.8]], 21, 40);
const maSeries = () => genSeries([[50, -0.004, 0.015, 1], [50, 0.006, 0.015, 1.2], [40, -0.006, 0.016, 1.1]], 33, 80);
function crosses(s) { const ind = indicators(s); let gc = null, dc = null; for (let i = 61; i < s.c.length; i++) { if (!gc && ind.ma5[i - 1] < ind.ma20[i - 1] && ind.ma5[i] > ind.ma20[i]) gc = i; if (gc && !dc && i > gc + 15 && ind.ma5[i - 1] > ind.ma20[i - 1] && ind.ma5[i] < ind.ma20[i]) dc = i } return {gc, dc} }
const srSeries = () => genSeries([[15, 0.012, 0.014, 1], [15, -0.01, 0.014, 0.9], [14, 0.011, 0.014, 1], [12, -0.008, 0.013, 0.8], [6, 0.02, 0.016, 2.4], [10, -0.005, 0.012, 0.9], [15, 0.01, 0.014, 1.1]], 61, 40);
const kdSeries = () => genSeries([[30, 0, 0.015, 1], [15, 0.016, 0.016, 1.5], [15, -0.014, 0.017, 1.3], [20, 0.004, 0.014, 1]], 77, 50);
const wSeries = () => genSeries([[25, -0.01, 0.012, 1], [10, 0.01, 0.012, 0.9], [10, -0.009, 0.012, 0.8], [12, 0.014, 0.014, 1.8], [10, 0.006, 0.012, 1]], 88, 60);
const mSeries = () => genSeries([[25, 0.01, 0.012, 1], [10, -0.01, 0.012, 0.9], [10, 0.009, 0.012, 0.8], [12, -0.014, 0.014, 1.6], [10, -0.005, 0.012, 1]], 99, 40);
function pumpSeries() { const s = genSeries([[50, 0.0005, 0.012, 0.6], [7, 0.085, 0.01, 5], [3, 0, 0.05, 6], [20, -0.035, 0.03, 2.5]], 101, 25); s.h[57] = rp(s.o[57] * 1.09); s.c[57] = rp(s.o[57] * 0.98); return s }
const SERIES = {shadow: shadowSeries, vol: volSeries, ma: maSeries, trend: S_UP, sr: srSeries, kd: kdSeries, w: wSeries, m: mSeries, pump: pumpSeries};

function candleLab() {
  const v = [0, 1, 2, 3].map(i => +$('#cl' + i).value); let [o, c, h, l] = v; h = Math.max(h, o, c); l = Math.min(l, o, c);
  [o, c, h, l].forEach((x, i) => $('#clv' + i).textContent = x);
  drawChart($('#candleLab'), {o: [o], h: [h], l: [l], c: [c], v: [1]}, {ma: [], vol: false, height: 220, big: true, legend: false, tip: false, range: [88, 112]});
  const body = Math.abs(c - o), up = h - Math.max(o, c), dn = Math.min(o, c) - l;
  let t = c > o ? '收盤比開盤高，是<b class="up">紅K</b>，買方贏了！' : c < o ? '收盤比開盤低，是<b class="down">綠K</b>，賣方贏了。' : '開盤等於收盤，是<b>十字線</b>，打平！';
  if (up > body * 2 && up > 1) t += '上影線好長，衝高後被打下來。'; if (dn > body * 2 && dn > 1) t += '下影線好長，殺低後有人接。';
  $('#candleSay').innerHTML = say(t, c >= o ? 'happy' : 'oops');
}

/* ============================================================ 動畫影片播放器 */
let VID = null;
function openVideo(i) {
  VID = {i, k: 0, playing: true, voice: store.get('voice', true), timer: null, anim: null};
  const d = document.createElement('div'); d.className = 'vid'; d.id = 'vid';
  d.innerHTML = `<div class="vbox" role="dialog" aria-label="教學動畫"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-family:var(--font-fun);font-size:18px">🎬 ${LESSONS[i].t}</b><button class="btn ghost" onclick="closeVideo()">關閉</button></div>
    <div class="screen" id="vscreen"></div><div class="cap"><div id="vniu" class="bounce"></div><div class="say" id="vsay"></div></div><div class="dots" id="vdots"></div>
    <div class="controls" style="justify-content:center"><button class="btn ghost" onclick="vStep(-1)">⏮ 上一段</button><button class="btn sun" id="vplay" onclick="vToggle()">⏸ 暫停</button><button class="btn ghost" onclick="vStep(1)">下一段 ⏭</button>
    <label class="checkrow"><input type="checkbox" id="vvoice" ${VID.voice ? 'checked' : ''} onchange="VID.voice=this.checked;store.set('voice',this.checked);if(!this.checked)stopVoice()"> 老師語音</label></div></div>`;
  document.body.appendChild(d); vShow();
}
function closeVideo() { if (!VID) return; clearTimeout(VID.timer); cancelAnimationFrame(VID.anim); stopVoice(); $('#vid')?.remove(); VID = null }
function stopVoice() { try { speechSynthesis.cancel() } catch (e) {} }
function speak(text, done) {
  try { if (!VID.voice || !window.speechSynthesis) throw 0; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g, ''));
    u.lang = 'zh-TW'; u.rate = 0.95; u.pitch = 1.15; const zh = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang)); if (zh) u.voice = zh;
    let fired = false; u.onend = () => { if (!fired) { fired = true; done() } }; speechSynthesis.speak(u);
    setTimeout(() => { if (!fired) { fired = true; done() } }, 2500 + text.length * 260) } catch (e) { setTimeout(done, 1800 + text.length * 170) }
}
function vShow() {

/* ============================================================ 股票老師 (共用) */
function stateAt(s, I, t) {
  const c = s.c[t], o = s.o[t], h = s.h[t], l = s.l[t], v = s.v[t], r0 = h - l || 1e-9;
  const hi20 = Math.max(...s.h.slice(Math.max(0, t - 20), t)), lo20 = Math.min(...s.l.slice(Math.max(0, t - 20), t));
  const lim = [1, 2, 3, 4].filter(k => t - k >= 0 && s.c[t - k + 1] / s.c[t - k] - 1 >= 0.095).length;
  return {c, o, h, l, v, ma5: I.ma5[t], ma20: I.ma20[t], ma60: I.ma60[t], ma20p: I.ma20[t - 5], vr: I.vma[t] ? v / I.vma[t] : 1, rsi: I.rsi[t], k: I.kd.K[t], d: I.kd.D[t],
    upper: (h - Math.max(o, c)) / r0, lower: (Math.min(o, c) - l) / r0, hi20, lo20, lim, r20: t >= 20 ? (c / s.c[t - 20] - 1) * 100 : 0};
}
function judgeBuy(s, I, t, amount, cap) {
  const x = stateAt(s, I, t), good = [], bad = [];
  if (x.ma20 && x.c > x.ma20 && x.ma20 > x.ma20p) good.push('股價在往上走的月線之上，順著趨勢買');
  if (x.ma60 && x.c < x.ma60 && x.ma20 < x.ma20p) bad.push('股價在季線下、月線往下彎，這是下跌趨勢，像在「接刀子」');
  if (x.ma60 && x.ma5 > x.ma20 && x.ma20 > x.ma60) good.push('均線排得很漂亮（5 日 > 月線 > 季線）');
  if (x.c > x.hi20 && x.vr >= 1.5) good.push(`帶量突破 20 天高點（成交量是平常的 ${x.vr.toFixed(1)} 倍）`);
  else if (x.c > x.hi20 && x.vr < 1) bad.push('突破了但是沒有量，小心是假突破');
  if (x.ma20 && x.c >= x.ma20 && x.c <= x.ma20 * 1.03 && x.lower > 0.4) good.push('回到月線附近、有下影線，下面有人在接');
  if (x.rsi > 80) bad.push(`RSI ${x.rsi.toFixed(0)} 太熱了，這是追高`);
  if (x.r20 > 40) bad.push(`20 天已經漲了 ${x.r20.toFixed(0)}%，追高風險很大`);
  if (x.lim >= 2) bad.push(`最近 4 天有 ${x.lim} 根漲停，可能是炒作`);
  if (x.upper > 0.5 && x.vr > 2 && x.h >= x.hi20 * 0.97) bad.push('今天高檔爆量長上影，常是主力在賣，不該在這裡買');
  if (x.ma20 && (x.c / x.ma20 - 1) > 0.15) bad.push(`股價離月線已經 ${((x.c / x.ma20 - 1) * 100).toFixed(0)}%，漲太遠了`);
  if (x.rsi < 30 && x.c < x.ma20) good.push('RSI 超賣可以搶反彈，但要設停損、只買一點點');
  if (amount > cap * 0.5) bad.push('一次用掉超過一半的錢，要分批買比較安全');
  return {good, bad};
}
function judgeSell(s, I, t, pnl, holdDays) {
  const x = stateAt(s, I, t), good = [], bad = [];
  if (x.ma20 && x.c < x.ma20 && pnl < 0) good.push('跌破月線而且虧損，停損出場，很有紀律');
  else if (x.ma20 && x.c < x.ma20) good.push('跌破月線出場，保住了獲利');
  if (pnl <= -15) bad.push(`賠了 ${pnl.toFixed(1)}% 才賣，停損太慢；下次可以設在 -7%~-8%`);
  else if (pnl <= -6) good.push(`賠 ${pnl.toFixed(1)}% 時就停損，避免越賠越多`);
  if (pnl > 0 && (x.rsi > 75 || (x.upper > 0.5 && x.vr > 1.8))) good.push('在太熱或出現長上影時獲利了結，時機不錯');
  if (pnl > 0 && x.ma5 && x.c > x.ma5 && x.ma5 > x.ma20 && x.rsi < 75 && x.upper < 0.4) bad.push('趨勢還很強就先賣，可能賣太早；可以等跌破 5 日線或月線再賣');

}

  tr.review = {ok, txt, rank: Math.round(rank * 100)};

  const ctx = {s: st.s, ind: st.ind, t: MK.t, cash: MK.cash, cap: MK.cap, pos, name: st.name, code, holdDays: pos.buyT != null ? MK.t - pos.buyT : 99};
  const r = execTrade(ctx, side, lots, px, type);

  MK.cash = ctx.cash; if (side === 'buy') pos.buyT = MK.t; if (!pos.shares) delete MK.pos[code];
  MK.trades.push(r.trade); MK.fb = r.trade.fb; if (silent) MK.news.unshift(`${mkLabel(MK.t)}：${st.name} 限價${side === 'buy' ? '買單' : '賣單'}成交 ${fmt(px)} × ${lotTxt(r.trade.lots)}`);
}

  else { const lim = +$('#mlim').value; if (!lim) { MK.fb = '<div class="fb mid">請輸入限價。</div>'; return renderMarket() }
    if (side === 'sell' && !(MK.pos[code] && MK.pos[code].shares >= Math.round(lots * 1000))) { MK.fb = '<div class="fb mid">持股不夠，不能掛賣單。</div>'; return renderMarket() }
    MK.orders.push({code, side, lots, limit: rp(lim), placed: t}); MK.fb = `<div class="fb mid"><div class="head">${niu('think')}已掛單</div>${st.name} ${side === 'buy' ? '買進' : '賣出'} ${lotTxt(lots)}，限價 ${fmt(rp(lim))}。之後幾天價格碰到就會成交，5 天沒成交會自動取消。</div>` }
  renderMarket();
}

function setPic(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
      const n = 256, c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d'), k = Math.min(n / img.width, n / img.height);
      g.drawImage(img, (n - img.width * k) / 2, (n - img.height * k) / 2, img.width * k, img.height * k);
      MY_PIC = c.toDataURL('image/png'); store.set('mascot', MY_PIC);
      if (store.get('mascot', null) !== MY_PIC) $('#picMsg').textContent = '這個瀏覽器無法儲存圖片，關掉網頁後會換回橘橘。';
      $('#logoNiu').innerHTML = niu('happy'); renderPic(); };
    img.onerror = () => $('#picMsg').textContent = '讀不到這張圖片，請換一張 PNG 或 JPG。';
    img.src = r.result; };
  r.readAsDataURL(file);
}

async function aiExplain(id) {
  const box = $('#ai' + id), all = [...(SIM ? SIM.trades : []), ...(MK ? MK.trades : [])], tr = all.find(x => x.id === id); if (!box || !SAMPLE || !tr) return;

交易當天與前 15 天（日=0 是當天）：${JSON.stringify(look)}`;

  const show = text => box.innerHTML = say(text.replace(/</g, '&lt;').replace(/\n/g, '<br>'));
